<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- halo discret -->
  <circle cx="256" cy="300" r="150" fill="url(#glow)"/>

  <!-- traînée -->
  <path d="M256 300 C 240 360 248 420 256 470 C 264 420 272 360 256 300 Z" fill="url(#flame)" opacity="0.5"/>

  <!-- fusée : silhouette élancée, pointe vers le haut -->
  <path d="M256 88
           C 292 130 312 196 312 258
           L 312 316
           C 312 322 308 326 302 326
           L 210 326
           C 204 326 200 322 200 316
           L 200 258
           C 200 196 220 130 256 88 Z"
        fill="url(#rocket)"/>

  <!-- ailerons géométriques -->
  <path d="M200 260 L 156 330 L 200 316 Z" fill="#4f46e5"/>
  <path d="M312 260 L 356 330 L 312 316 Z" fill="#4f46e5"/>

  <!-- hublot : anneau fin, verre sombre -->
  <circle cx="256" cy="196" r="30" fill="#0b1023"/>
  <circle cx="256" cy="196" r="30" fill="none" stroke="#e0e7ff" stroke-width="5"/>

  <!-- reflet du hublot -->
  <path d="M244 184 A 18 18 0 0 1 262 178" stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- flammes -->
  <path d="M232 330 L 244 402 L 256 372 L 268 402 L 280 330 Z" fill="url(#flame)"/>

  <!-- étoiles : points fins et asymétriques -->
  <circle cx="120" cy="120" r="3.5" fill="#e0e7ff" opacity="0.8"/>
  <circle cx="398" cy="96" r="3" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="432" cy="208" r="2.5" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="86" cy="300" r="2.5" fill="#e0e7ff" opacity="0.4"/>
  <circle cx="420" cy="380" r="3" fill="#e0e7ff" opacity="0.35"/>

  <!-- arc orbital : trait élégant -->
  <path d="M 96 356 A 190 190 0 0 1 300 92"
        fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <circle cx="300" cy="92" r="6" fill="#818cf8" opacity="0.8"/>
</svg>
