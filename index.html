<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px;font:12px monospace;z-index:99999;white-space:pre-wrap;';
      d.textContent = 'ERREUR: ' + (e.message || 'inconnue') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
      document.body.appendChild(d);
    });
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;top:50%;left:0;right:0;text-align:center;color:#f87171;padding:12px;font:13px monospace;';
          d.textContent = 'App non montée. React=' + (window.React ? 'OK' : 'ABSENT') + ' Recharts=' + (window.Recharts ? 'OK' : 'ABSENT') + ' PeaCoPilot=' + (window.PeaCoPilot ? 'OK' : 'ABSENT');
          document.body.appendChild(d);
        }
      }, 3000);
    });
  </script>
  <script src="./app.js"></script>
</body>
