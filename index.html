
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PEA Co-Pilot — Allocation & DCA</title>
  <meta name="description" content="Co-pilote d'allocation PEA : rééquilibrage DCA, allocation optimale par profil et suivi d'objectif." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind (browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- React 18 UMD -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- ⚠️ prop-types : REQUIS par Recharts UMD, doit être chargé AVANT -->
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Recharts (UMD) — hébergé dans ce dépôt -->
  <script src="./Recharts.js"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; }
    #root { min-height: 100vh; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // --- Diagnostic temporaire (à retirer une fois l'app fonctionnelle) ---
    window.addEventListener('error', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px;font:12px monospace;z-index:99999;white-space:pre-wrap;';
      d.textContent = 'ERREUR: ' + (e.message || 'inconnue') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
      document.body.appendChild(d);
    });
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;top:50%;left:0;right:0;text-align:center;color:#f87171;padding:12px;font:13px monospace;z-index:99999;';
          d.textContent = 'App non montée. React=' + (window.React ? 'OK' : 'ABSENT') + ' PropTypes=' + (window.PropTypes ? 'OK' : 'ABSENT') + ' Recharts=' + (window.Recharts ? 'OK' : 'ABSENT') + ' PeaCoPilot=' + (window.PeaCoPilot ? 'OK' : 'ABSENT');
          document.body.appendChild(d);
        }
      }, 3000);
    });
  </script>
  <script src="./app.js?v=20261021"></script>
</body>
</html>
